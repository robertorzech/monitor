name = "partnerize-monitor"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Cron - sprawdza co 15 minut, caly czas, 24/7
[triggers]
crons = ["*/15 * * * *"]

# Origin dashboardu (GitHub Pages). localhost jest wpuszczany zawsze (testy).
[vars]
ALLOWED_ORIGIN = "https://robertorzech.github.io"

# KV Namespace - do przechowywania poprzednich wartosci
# Utworz: npx wrangler kv namespace create MONITOR_KV  -> wklej zwrocone id ponizej
[[kv_namespaces]]
binding = "MONITOR_KV"
id = "PLACEHOLDER_UZUPELNIJ_PO_KROKU_4"
